name: tentaclaire-test

services:
  unit:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/shared/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    command: sh -c "npm ci && npm run build -w shared && npm run test"

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    environment:
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/shared/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    command: sh -c "npm ci && npm run build && npx playwright test --config=e2e/playwright.config.ts"
